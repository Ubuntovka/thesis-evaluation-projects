stages:
  - build
  - assess

.uiqlab-rules:
  rules:
    - if: '$CI_COMMIT_BRANCH == "ci-evaluation"'
    - if: '$CI_COMMIT_BRANCH =~ /^feature\//'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^feature\//'

build-web-app:
  extends: .uiqlab-rules
  stage: build
  tags:
    - uiqlab-local
  before_script:
    - export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
    - node --version
    - npm --version
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - .next/
    expire_in: 1 day

web-ui-assessment:
  extends: .uiqlab-rules
  stage: assess
  tags:
    - uiqlab-local
  needs:
    - job: build-web-app
      artifacts: true
  timeout: 1h
  allow_failure:
    exit_codes:
      - 2
  variables:
    LOCAL_PREVIEW_BASE_URL: "http://127.0.0.1:3000"
    UIQLAB_PREVIEW_URL: "http://host.docker.internal:3000"
  before_script:
    - export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
    - node --version
    - npm --version
    - test -n "$UIQLAB_ORCHESTRATOR_URL"
    - curl --fail --show-error "${UIQLAB_ORCHESTRATOR_URL%/}/docs" > /dev/null
  script:
    - npm ci
    - npm ci --prefix tools/uiqlab-ci
    - npm run build --prefix tools/uiqlab-ci
    - |
      npm run start -- --hostname 0.0.0.0 --port 3000 > next-server.log 2>&1 &
      server_pid=$!
      trap 'kill "$server_pid" 2>/dev/null || true' EXIT

      server_ready=false
      for attempt in $(seq 1 30); do
        if curl --fail --silent "$LOCAL_PREVIEW_BASE_URL" > /dev/null; then
          server_ready=true
          break
        fi

        if ! kill -0 "$server_pid" 2>/dev/null; then
          echo "Next.js exited before becoming ready."
          cat next-server.log
          exit 1
        fi

        sleep 1
      done

      if [ "$server_ready" != "true" ]; then
        echo "Next.js did not become ready within 30 seconds."
        cat next-server.log
        exit 1
      fi

      curl --fail --show-error "$LOCAL_PREVIEW_BASE_URL/courses" > /dev/null
      curl --fail --show-error "$LOCAL_PREVIEW_BASE_URL/dashboard" > /dev/null

      export UIQLAB_BRANCH="${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME:-$CI_COMMIT_BRANCH}"

      echo "Local preview: $LOCAL_PREVIEW_BASE_URL"
      echo "UIQLab preview: $UIQLAB_PREVIEW_URL"
      echo "Orchestrator: $UIQLAB_ORCHESTRATOR_URL"

      node tools/uiqlab-ci/dist/src/cli.js --orchestrator-url "http://127.0.0.1:9"
  artifacts:
    when: always
    name: "uiqlab-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
    paths:
      - uiqlab-report.html
      - uiqlab-report.json
      - next-server.log
    expire_in: 30 days
  after_script:
    - |
      if [ -f uiqlab-report.html ] && grep -q 'data:image/' uiqlab-report.html; then
        echo "Visuals embedded"
      else
        echo "No visuals embedded"
      fi
